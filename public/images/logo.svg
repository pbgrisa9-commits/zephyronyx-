<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="zGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0"/>
      <stop offset="50%" stop-color="#60a5fa" stop-opacity="1"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect x="4" y="4" width="192" height="192" rx="42" fill="url(#bgGrad)"/>

  <!-- Orbit ring (space element) -->
  <ellipse cx="100" cy="100" rx="78" ry="30" fill="none" stroke="url(#ringGrad)" stroke-width="3" transform="rotate(-20 100 100)"/>

  <!-- Small orbit dot -->
  <circle cx="168" cy="66" r="5" fill="#93c5fd" transform="rotate(-20 100 100)"/>

  <!-- Stylized Z shape (sport speed-mark meets letterform) -->
  <path d="M62 66 H140 L84 118 H140 L140 134 H60 L116 82 H62 Z"
        fill="url(#zGrad)"/>

  <!-- Subtle highlight line under Z for "speed" feel -->
  <path d="M70 148 H120" stroke="#93c5fd" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
</svg>
